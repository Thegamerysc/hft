name: Build and package Windows shadow lab
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - name: Build, test and package
        shell: pwsh
        run: ./Package.ps1 -OutputDirectory "$env:RUNNER_TEMP/traderpromax" -Version '2.0.0-shadow'
      - uses: actions/upload-artifact@v4
        with:
          name: TraderProMax-win-x64
          path: |
            ${{ runner.temp }}/traderpromax/*.zip
            ${{ runner.temp }}/traderpromax/*.sha256
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TraderProMax-win-x64
          path: release-files
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-files/* --prerelease --title "TraderProMax C# shadow lab" --notes "Windows x64 runtime bundle. Extract the full folder and run Launch.cmd. See README.md and REQUIREMENTS.md. Starts in shadow mode; accounts and market-data access are separate."
